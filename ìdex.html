<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang Đăng Ký Tài Khoản - Bootstrap Forms</title>
    <!-- Nhúng Bootstrap 5 CSS từ CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <!-- Khung Form Đăng Ký -->
          <div class="card shadow-sm border-0 rounded-3 p-4">
            <div class="text-center mb-4">
              <h2 class="fw-bold text-primary">Đăng Ký Tài Khoản</h2>
              <p class="text-muted small">
                Vui lòng điền đầy đủ thông tin bên dưới để tạo tài khoản mới
              </p>
            </div>

            <form action="#" method="POST">
              <!-- 1. Họ và tên -->
              <div class="mb-3">
                <label for="fullName" class="form-label fw-semibold"
                  >Họ và tên</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="fullName"
                  placeholder="Nguyễn Văn A"
                  required
                />
              </div>

              <!-- 2. Email -->
              <div class="mb-3">
                <label for="emailInput" class="form-label fw-semibold"
                  >Địa chỉ Email</label
                >
                <input
                  type="email"
                  class="form-control"
                  id="emailInput"
                  placeholder="name@example.com"
                  required
                />
                <div class="form-text text-muted">
                  Chúng tôi cam kết bảo mật email của bạn.
                </div>
              </div>

              <!-- 3. Mật khẩu -->
              <div class="row mb-3">
                <div class="col-md-6 mb-3 mb-md-0">
                  <label for="passwordInput" class="form-label fw-semibold"
                    >Mật khẩu</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="passwordInput"
                    placeholder="••••••••"
                    required
                  />
                </div>
                <!-- 4. Xác nhận mật khẩu -->
                <div class="col-md-6">
                  <label for="confirmPassword" class="form-label fw-semibold"
                    >Xác nhận mật khẩu</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="confirmPassword"
                    placeholder="••••••••"
                    required
                  />
                </div>
              </div>

              <!-- 5. Giới tính (Radio buttons) -->
              <div class="mb-3">
                <label class="form-label fw-semibold d-block">Giới tính</label>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="gender"
                    id="genderMale"
                    value="male"
                    checked
                  />
                  <label class="form-check-label" for="genderMale">Nam</label>
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="gender"
                    id="genderFemale"
                    value="female"
                  />
                  <label class="form-check-label" for="genderFemale">Nữ</label>
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="gender"
                    id="genderOther"
                    value="other"
                  />
                  <label class="form-check-label" for="genderOther">Khác</label>
                </div>
              </div>

              <!-- 6. Sở thích (Checkboxes) -->
              <div class="mb-3">
                <label class="form-label fw-semibold d-block">Sở thích</label>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="hobbyReading"
                    value="reading"
                  />
                  <label class="form-check-label" for="hobbyReading"
                    >Đọc sách</label
                  >
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="hobbyTravel"
                    value="travel"
                  />
                  <label class="form-check-label" for="hobbyTravel"
                    >Du lịch</label
                  >
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="hobbySports"
                    value="sports"
                  />
                  <label class="form-check-label" for="hobbySports"
                    >Thể thao</label
                  >
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="hobbyGaming"
                    value="gaming"
                  />
                  <label class="form-check-label" for="hobbyGaming"
                    >Chơi game</label
                  >
                </div>
              </div>

              <!-- 7. Quốc gia (Dropdown Select) -->
              <div class="mb-4">
                <label for="countrySelect" class="form-label fw-semibold"
                  >Quốc gia</label
                >
                <select class="form-select" id="countrySelect" required>
                  <option value="" selected disabled>
                    -- Chọn quốc gia --
                  </option>
                  <option value="VN">Việt Nam</option>
                  <option value="US">Mỹ</option>
                  <option value="JP">Nhật Bản</option>
                  <option value="KR">Hàn Quốc</option>
                  <option value="SG">Singapore</option>
                </select>
              </div>

              <!-- Điều khoản sử dụng -->
              <div class="mb-4 form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="termsCheck"
                  required
                />
                <label
                  class="form-check-label small text-muted"
                  for="termsCheck"
                >
                  Tôi đồng ý với
                  <a href="#" class="text-decoration-none"
                    >Điều khoản sử dụng</a
                  >
                  và
                  <a href="#" class="text-decoration-none">Chính sách bảo mật</a
                  >.
                </label>
              </div>

              <!-- 8. Nút Submit -->
              <button
                type="submit"
                class="btn btn-primary btn-lg w-100 fw-bold"
              >
                Đăng Ký Ngay
              </button>
            </form>

            <!-- Chuyển hướng tới trang Đăng nhập -->
            <div class="text-center mt-4">
              <span class="text-muted small">Đã có tài khoản?</span>
              <a href="#" class="text-decoration-none small fw-bold"
                >Đăng nhập ngay</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Nhúng Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
